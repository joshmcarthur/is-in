version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native compiler and does not ship the programmatic
      # API that `astro check` / Volar need. Stay on 6.x until Astro supports it:
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
